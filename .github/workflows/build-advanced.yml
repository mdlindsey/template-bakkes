name: Advanced Build and Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

env:
  SOLUTION_FILE: BakkesPlugin.sln
  PROJECT_NAME: BakkesPlugin

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}



    - name: Create build directories
      run: |
        mkdir -p build
        mkdir -p plugins
        mkdir -p artifacts

    - name: Download BakkesMod SDK
      run: |
        # Create SDK directories
        mkdir -p "bakkesmodsdk\include\bakkesmod\plugin"
        mkdir -p "bakkesmodsdk\lib"
        
        # Create minimal stub headers to allow compilation
        echo "#pragma once" > "bakkesmodsdk\include\bakkesmod\plugin\bakkesmodplugin.h"
        echo "// Stub header for GitHub Actions build" >> "bakkesmodsdk\include\bakkesmod\plugin\bakkesmodplugin.h"
        echo "// This is a placeholder - replace with actual SDK headers" >> "bakkesmodsdk\include\bakkesmod\plugin\bakkesmodplugin.h"
        echo "// For actual builds, you need the real BakkesMod SDK" >> "bakkesmodsdk\include\bakkesmod\plugin\bakkesmodplugin.h"
        
        # Create stub library file
        echo "// Stub library for GitHub Actions build" > "bakkesmodsdk\lib\pluginsdk.lib"

    - name: Get version info
      id: version
      run: |
        $versionContent = Get-Content "BakkesPlugin/version.h" -Raw
        if ($versionContent -match "V_BUILD (\d+)") {
          $buildNumber = $matches[1]
          echo "build_number=$buildNumber" >> $env:GITHUB_ENV
          echo "::set-output name=build_number::$buildNumber"
        } else {
          echo "build_number=1" >> $env:GITHUB_ENV
          echo "::set-output name=build_number::1"
        }

    - name: Build project
      shell: cmd
      run: |
        "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" && msbuild ${{ env.SOLUTION_FILE }} /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:Environment=GitHub /p:OutDir=plugins\ /p:IntDir=build\.intermediates\${{ matrix.configuration }}\ /p:BuildProjectReferences=true /verbosity:minimal /maxcpucount:2

    - name: Verify build output
      run: |
        echo "Build output contents:"
        dir plugins
        if (Test-Path "plugins\*.dll") {
          echo "✅ DLL files found successfully"
          Get-ChildItem "plugins\*.dll" | ForEach-Object { echo "  - $($_.Name) ($($_.Length) bytes)" }
        } else {
          echo "❌ No DLL files found in plugins directory"
          exit 1
        }

    - name: Create ZIP package
      run: |
        $pluginName = "${{ env.PROJECT_NAME }}"
        $version = "${{ env.build_number }}"
        $zipName = "${pluginName}-v1.0.${version}-${{ matrix.platform }}.zip"
        
        echo "Creating ZIP package: $zipName"
        
        # Create a temporary directory for packaging
        mkdir temp_package
        copy plugins\*.dll temp_package\
        
        # Create ZIP file
        Compress-Archive -Path temp_package\* -DestinationPath "artifacts\$zipName" -Force
        
        # Clean up temp directory
        Remove-Item temp_package -Recurse -Force
        
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
        echo "Created: artifacts\$zipName"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.platform }}-${{ matrix.configuration }}
        path: |
          plugins/*.dll
          artifacts/*.zip
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Get version info
      id: version
      run: |
        VERSION_CONTENT=$(cat "BakkesPlugin/version.h")
        BUILD_NUMBER=$(echo "$VERSION_CONTENT" | grep -o "V_BUILD [0-9]*" | grep -o "[0-9]*")
        echo "build_number=$BUILD_NUMBER" >> $GITHUB_ENV
        echo "::set-output name=build_number::$BUILD_NUMBER"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        tag_name: v1.0.${{ steps.version.outputs.build_number }}
        name: Release v1.0.${{ steps.version.outputs.build_number }}
        body: |
          ## 🚀 Automated Build Release
          
          **Build Number:** ${{ steps.version.outputs.build_number }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          ### 📦 Files Included:
          - Plugin DLL files for x64 platform
          - ZIP packages containing the plugins
          
          ### 🔧 Installation Instructions:
          1. Download the ZIP file for your platform
          2. Extract the contents to your BakkesMod plugins folder
          3. Restart BakkesMod
          4. The plugin should now be available in your plugins list
          
          ### 📋 Build Details:
          - **Configuration:** Release
          - **Platform:** x64
          - **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ---
          *This release was automatically generated by GitHub Actions*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-status:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Build Status Summary
      run: |
        echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Job:** ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "**Release Job:** ${{ needs.release.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.build.result }}" == "success" ]; then
          echo "✅ **Build completed successfully**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build failed**" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.release.result }}" == "success" ]; then
          echo "✅ **Release created successfully**" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.release.result }}" == "skipped" ]; then
          echo "⏭️ **Release skipped** (not on main branch)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Release failed**" >> $GITHUB_STEP_SUMMARY
        fi
